{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Testador QS{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'webapp/styles.css' %}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'webapp:dashboard' %}">Testador QS</a>
    <nav>
      <a href="{% url 'webapp:bank' %}">Banco</a>
      <a href="{% url 'webapp:exam_home' %}">Simulado</a>
      <a href="{% url 'webapp:reports' %}">Relatórios</a>
    </nav>
  </header>
  <main class="shell">
    {% if messages %}
      <div class="messages">
        {% for message in messages %}
          <div class="message {{ message.tags }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
