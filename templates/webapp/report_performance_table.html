<article class="report-panel performance-card">
  <div class="report-panel-head">
    <h2>{{ title }}</h2>
  </div>
  {% if rows %}
    <div class="performance-list">
      {% for row in rows|slice:":6" %}
        <div class="performance-row">
          <div class="performance-row-head">
            <strong title="{{ row.label }}">{{ row.label }}</strong>
            <em>{{ row.accuracy|floatformat:1 }}%</em>
          </div>
          <span>{{ row.accuracy_label }} · {{ row.correct_label }}</span>
          <div class="metric-bar"><span style="width: {{ row.accuracy_width }}%"></span></div>
        </div>
      {% endfor %}
    </div>
  {% else %}
    <div class="panel-empty">{{ empty_text }}</div>
  {% endif %}
</article>
